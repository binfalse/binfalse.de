message: >-
  I cannot believe everything we challenge ourselves with in life makes a
  difference. All the time put in thinking about the different things that
  people encounter every working day is just really important, as no other
  person will probably encounter existence for any of us. Personally I think
  that folk must be more mentally stable. Technology is wonderful, however, so
  much of everything you might know about is so abstract. Having a cup of coffee
  is a zen process that takes one back again to the present occasion. We need to
  be more in the here and now, without being stressed by life and the drama we
  encounter each day.
