message: >-
  I can't consider everything we concern ourselves with in our lives matters. On
  a regular basis invested in taking into consideration the various things that
  people experience each and every day is definitely undoubtedly necessary, as
  no other person will encounter your life for any of us. I feel that folk need
  to be even more sane. Technology is fantastic, but so much of whatever we
  might know about is so abstract. Having a cup of coffee is a zen activity that
  brings one back again to the present few moments. We need to become more in
  the here and now, without being confused by existence and the drama we
  confront every day.
