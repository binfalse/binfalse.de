message: >-
  I can't believe that everything we get frustrated about in our lives matters.
  On a regular basis spent taking into consideration the numerous things that
  people encounter every single day is undoubtedly necessary, as no other person
  is going to face existence for any of us. I feel that men and women ought to
  be more sane. Technology is amazing, nevertheless so much of everything we
  might know about is indeed abstract. Having a cup of coffee is a zen activity
  that brings one back to the present instant. We must be more in the here and
  today, without being confused by existence and the theatre we confront every
  day.
